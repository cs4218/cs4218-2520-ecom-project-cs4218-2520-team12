name: Playwright E2E Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        name: Run Playwright Tests
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  cache: "npm"
                  cache-dependency-path: |
                      package-lock.json
                      client/package-lock.json

            - name: Install root dependencies
              run: npm ci

            - name: Install client dependencies
              run: cd client && npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps

            - name: Start backend server
              run: npm run start > backend.log 2>&1 &
              env:
                  PORT: 6060
                  DEV_MODE: development
                  NODE_ENV: test
                  MONGO_URL: ${{ secrets.MONGO_URL }}
                  JWT_SECRET: ${{ secrets.JWT_SECRET }}
                  BRAINTREE_MERCHANT_ID: ${{ secrets.BRAINTREE_MERCHANT_ID }}
                  BRAINTREE_PUBLIC_KEY: ${{ secrets.BRAINTREE_PUBLIC_KEY }}
                  BRAINTREE_PRIVATE_KEY: ${{ secrets.BRAINTREE_PRIVATE_KEY }}

            - name: Wait for backend server
              run: |
                  for i in {1..45}; do
                    if curl -fsS http://localhost:6060 > /dev/null; then
                      echo "Backend server is up"
                      exit 0
                    fi
                    sleep 2
                  done
                  echo "Backend server failed to start in time"
                  cat backend.log || true
                  exit 1

            - name: Start frontend server
              run: cd client && CI=false npm start > ../frontend.log 2>&1 &

            - name: Wait for frontend server
              run: |
                  for i in {1..45}; do
                    if curl -fsS http://localhost:3000 > /dev/null; then
                      echo "Frontend server is up"
                      exit 0
                    fi
                    sleep 2
                  done
                  echo "Frontend server failed to start in time"
                  cat frontend.log || true
                  exit 1

            - name: Run Playwright tests
              run: npm run test:e2e
              env:
                  NODE_ENV: test
                  CI: true

            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report
                      test-results
                  retention-days: 7

            - name: Print backend log on failure
              if: failure()
              run: cat backend.log || true

            - name: Print frontend log on failure
              if: failure()
              run: cat frontend.log || true
